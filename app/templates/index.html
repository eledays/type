<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>type — Лента слов</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=close,error" />

    <link rel="icon" href="{{ url_for('static', filename='img/fav.ico') }}" type="image/x-icon">
</head>
<body>
    {% if anonymous_remaining is defined and anonymous_remaining is not none %}
    <a class="anonymous-notice" href="{{ url_for('auth.login', next=request.full_path) }}">
        Анонимный режим · осталось действий:
        <span id="anonymous-remaining">{{ anonymous_remaining }}</span> · Войти
    </a>
    {% endif %}
    <iframe src="{{ card_url }}" class="current"></iframe>
    <iframe src="{{ card_url }}" class="next"></iframe>

    <button class="error" onclick="document.querySelector('.current').contentWindow.switchMenu()">
        <span class="material-symbols-rounded notranslate">error</span>
    </button>

    {% if strike != None %}
    <div class="strike-block">
        <p>{{ strike }}</p>
    </div>
    {% endif %}

    <div class="fire" id="fire"></div>

    <script>
        window.routeConfig = {{ {
            'swipePermission': url_for('practice_api.swipe_permission'),
            'skipAttempt': url_for('practice_api.skip_attempt')
        }|tojson }};

        window.updateAnonymousRemaining = (remaining) => {
            if (remaining === null || remaining === undefined) return;
            const counter = document.getElementById('anonymous-remaining');
            if (counter) counter.textContent = remaining;
        };
    </script>
    <script src="{{ url_for('static', filename='js/applyColorTheme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/framesManaging.js') }}"></script>
</body>
</html>
