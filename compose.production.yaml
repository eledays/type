x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    environment:
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the production env file}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-type}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}@postgres:5432/${POSTGRES_DB:-type}
      URL: https://${DOMAIN:?Set DOMAIN in the production env file}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:?Set YANDEX_CLIENT_ID in the production env file}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:?Set YANDEX_CLIENT_SECRET in the production env file}
      YANDEX_REDIRECT_URI: https://${DOMAIN:?Set DOMAIN in the production env file}/auth/yandex/callback
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      TRUSTED_HOSTS: ${DOMAIN:?Set DOMAIN in the production env file},localhost
      TRUSTED_PROXY_COUNT: "1"
      COOKIE_SECURE: "true"
      HSTS_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: always

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-type}
      POSTGRES_USER: ${POSTGRES_USER:-type}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
    logging: *default-logging
    restart: always

  redis:
    logging: *default-logging
    restart: always

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the production env file}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt_data:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: always

  certbot:
    image: certbot/certbot:v5.7.0
    entrypoint: ["/bin/sh"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in the production env file}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in the production env file}
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - frontend
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  letsencrypt_data:
  certbot_webroot:
