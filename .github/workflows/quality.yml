name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: type_test
          POSTGRES_USER: type
          POSTGRES_PASSWORD: type-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U type -d type_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DEBUG: "true"
      SECRET_KEY: test-secret-key-for-ci-with-32-characters
      DATABASE_URL: postgresql+psycopg://type:type-test@localhost:5432/type_test
      TEST_POSTGRES_URL: postgresql+psycopg://type:type-test@localhost:5432/type_test
      ALLOW_POSTGRES_TESTS: "1"
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r requirements-audit.txt
      - run: flask --app app db upgrade
      - run: pytest
      - run: scripts/check_security.sh
